server:
  port: 8080

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**,/oauth2/**,/login/oauth2/**

            - id: provider-service
              uri: lb://provider-service
              predicates:
                - Path=/providers/**

            - id: schedule-service
              uri: lb://schedule-service
              predicates:
                - Path=/slots/**

            - id: appointment-service
              uri: lb://appointment-service
              predicates:
                - Path=/appointments/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payments/**

            - id: review-service
              uri: lb://review-service
              predicates:
                - Path=/reviews/**

            - id: record-service
              uri: lb://record-service
              predicates:
                - Path=/records/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: mysecretkeymysecretkeymysecretkey123